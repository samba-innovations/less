name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.gitignore', 'LICENSE']
  workflow_dispatch:

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: samba-innovations/less

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_DOMAIN || 'sambainnovations.com' }}
            NEXT_PUBLIC_SSO_URL=${{ vars.NEXT_PUBLIC_SSO_URL || 'https://sso.sambainnovations.com' }}
            NEXT_PUBLIC_HUB_URL=${{ vars.NEXT_PUBLIC_HUB_URL || 'https://admin.sambainnovations.com' }}
